spring:
  application:
    name: gunpla_eshop_api
  profiles:
    active:
      - development
  config:
    import:
      - "configtree:./"
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format-sql: true
    defer-datasource-initialization: true
  sql:
    init:
      mode: never
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false

logging:
  level:
    org:
      springframework:
        web: debug

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS}